name: flutter_clean_architecture
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter

  # Locale
  flutter_localizations:
    sdk: flutter
  intl: any

  # DI
  get_it: ^9.2.0

  # Layout
  gap: ^3.0.1

  # Networking
  dio: ^5.9.1
  retrofit: ^4.9.2
  json_annotation: ^4.9.0
  pretty_dio_logger: ^1.4.0
  freezed_annotation: ^3.1.0
  google_fonts: ^8.0.0

  # State management
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1

  # Routing
  go_router: ^17.0.1

  # Shared
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0

  # Location
  geolocator: ^14.0.2

  # Utils
  equatable: ^2.0.8

  # Animation
  lottie: ^3.3.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  freezed: ^3.2.4
  flutter_lints: ^6.0.0
  build_runner: ^2.10.5
  json_serializable: ^6.11.4
  retrofit_generator: ^10.2.1
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/json/
